<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#9FD8FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دروس العربية ٣">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>html,body{margin:0;padding:0}</style>
<title>دروس العربية ٣</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&family=Noto+Naskh+Arabic:wght@500;700&display=swap">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
/* Layout: full-screen voxel world with an HTML HUD — counters + minimap top, joystick and jump above a centred 9-slot hotbar at the bottom, bright lesson cards as modals. Single bright theme by choice (the family wants light, colourful screens). */
:root{
  --sky:#9FD8FF; --paper:#FFFBEF; --ink:#3A2A14; --muted:#7A6A55; --wood:#D9A05B; --wood2:#A86F2E;
  --gold:#FFD93D; --good:#38B86A; --coral:#FF7A59; --mint:#2EC4B6; --grape:#9B7BFF; --sea:#4FA8FF; --maroon:#8A1538;
  --display:'Baloo Bhaijaan 2',system-ui,sans-serif; --read:'Noto Naskh Arabic','Amiri','Traditional Arabic',serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--display);direction:rtl;overflow:hidden;-webkit-tap-highlight-color:transparent;touch-action:none;user-select:none;-webkit-user-select:none}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
input{font-family:inherit;color:inherit}
#gl{position:fixed;inset:0}
#gl canvas{display:block;width:100%;height:100%;touch-action:none}
.blockbtn{background:var(--paper);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);border-radius:10px;display:grid;place-items:center}
.blockbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.hud{position:fixed;top:0;left:0;right:0;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 0;display:flex;align-items:center;gap:6px;pointer-events:none;z-index:5;flex-wrap:wrap}
.hud > *{pointer-events:auto}
.pill{background:var(--paper);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);border-radius:10px;padding:2px 10px;font-weight:800;font-size:18px;display:flex;gap:5px;align-items:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.bump{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.pill.star{background:#FFF4C2}
.pill canvas{width:22px;height:22px;image-rendering:pixelated}
.hud .grow{flex:1}
.side{position:fixed;right:10px;top:calc(62px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;z-index:5}
.side .icon{width:40px;height:40px;font-size:18px}
@media (max-width:430px){#swordName{display:none}}
.icon{width:42px;height:42px;font-size:20px}
#mini{position:fixed;left:10px;top:calc(60px + env(safe-area-inset-top,0px));width:112px;height:112px;border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);z-index:5;background:#5BC236;image-rendering:pixelated}
.joy{position:fixed;left:14px;bottom:calc(70px + env(safe-area-inset-bottom,0px));width:132px;height:132px;border-radius:50%;background:rgba(255,251,239,.5);border:3px solid rgba(58,42,20,.5);z-index:5;touch-action:none}
.joy .knob{pointer-events:none;position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:var(--paper);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;font-size:24px}
.rbtns{position:fixed;right:14px;bottom:calc(72px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;align-items:flex-end;z-index:5}
.round{width:68px;height:68px;border-radius:16px;background:var(--paper);border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);font-size:28px;display:grid;place-items:center;line-height:1}
.round small{font-size:12px;font-weight:800}
.round.on{background:var(--gold)}
.round:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.act{min-width:128px;min-height:68px;padding:8px 14px;border-radius:16px;background:var(--gold);border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);font-size:19px;font-weight:800;line-height:1.15;animation:pulse 1.2s ease-in-out infinite;text-align:center}
.act:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.act small{display:block;font-size:13px;font-weight:700;opacity:.8}
.hotbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;gap:3px;padding:4px;background:rgba(58,42,20,.78);border-radius:10px;direction:ltr;max-width:calc(100% - 16px)}
.hs{position:relative;width:44px;height:44px;border:3px solid #8C7A60;border-radius:6px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.hs canvas{width:30px;height:30px;image-rendering:pixelated}
.hs b{position:absolute;bottom:-2px;right:1px;color:#fff;font-size:12px;font-weight:800;text-shadow:0 1px 0 #000,0 0 2px #000}
.hs.sel{border-color:#FFF;background:rgba(255,255,255,.45);transform:translateY(-3px)}
@media (max-width:440px){.hs{width:36px;height:36px;border-width:2px}.hs canvas{width:24px;height:24px}}
.hint{position:fixed;left:132px;right:60px;margin-inline:auto;width:fit-content;top:calc(62px + env(safe-area-inset-top,0px));background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:8px 14px;font-weight:800;font-size:17px;z-index:6;max-width:calc(100% - 192px);text-align:center;animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.hint.alarm{background:#FFE1D6;border-color:#B8321E;color:#8A2414;font-size:21px}
.cross{position:fixed;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;z-index:4;pointer-events:none}
.cross::before,.cross::after{content:"";position:absolute;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.cross::before{left:10px;top:0;width:2px;height:22px}.cross::after{top:10px;left:0;height:2px;width:22px}
.fb{position:fixed;width:30px;height:30px;border-radius:4px;border:3px solid rgba(0,0,0,.4);box-shadow:inset -5px -5px 0 rgba(0,0,0,.18),inset 4px 4px 0 rgba(255,255,255,.35);z-index:14;pointer-events:none;transition:transform .8s cubic-bezier(.3,.9,.4,1),opacity .2s .7s;opacity:1}
.flystar{position:fixed;z-index:14;font-size:40px;pointer-events:none;transition:transform .9s cubic-bezier(.3,.9,.4,1),opacity .25s .75s}
.overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(159,216,255,.5)}
.overlay.start{background:linear-gradient(#DDF3FF,#9FD8FF)}
.card{width:100%;max-width:460px;max-height:100%;overflow:auto;background:var(--paper);border:3px solid var(--ink);border-radius:14px;box-shadow:0 8px 0 var(--ink);padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.card > *{flex-shrink:0}
.card h1{margin:0;font-size:32px;font-weight:800;line-height:1.15;text-wrap:balance}
.card h2{margin:0;font-size:23px;font-weight:800;line-height:1.25;text-wrap:balance}
.card p{margin:0;font-size:17px;color:var(--muted);font-weight:700}
.card p.again{color:var(--coral)}
.who{display:flex;align-items:center;gap:8px;background:#EAF6FF;border:2px solid var(--ink);border-radius:999px;padding:3px 14px 3px 10px;font-weight:800;font-size:17px}
.who.monster{background:#EDE6FF}.who.ore{background:#FFF1C2}.who.pet{background:#DFF6E6}.who.vill{background:#FFE6F0}
.qtext{font-family:var(--read);font-size:29px;font-weight:700;line-height:1.7;margin:0;text-wrap:balance}
.stem{font-family:var(--read);font-size:60px;font-weight:700;line-height:1.5;direction:rtl}
.stem .blank{display:inline-block;width:.8em;height:1.05em;vertical-align:-.12em;border:4px dashed var(--coral);border-radius:10px;background:#FFF0EA;margin-inline:.05em}
.stem .fill{color:#1E7A41;background:#DFF6E6;border-radius:10px;padding-inline:.06em}
.say{width:50px;height:50px;font-size:22px}
.row{display:flex;gap:10px;width:100%;justify-content:center;flex-wrap:wrap}
.choice{flex:1 1 40%;min-width:120px;min-height:68px;border:3px solid var(--ink);border-radius:12px;box-shadow:0 6px 0 var(--ink);background:repeating-linear-gradient(180deg,var(--wood) 0 14px,var(--wood2) 14px 17px);font-family:var(--read);font-weight:700;display:grid;place-items:center;padding:6px 10px;transition:transform .12s,opacity .3s;overflow-wrap:anywhere}
.choice.word{font-size:23px;line-height:1.5}
.choice.long{flex-basis:100%;font-size:20px}
.choice.letter{flex:0 1 130px;font-size:62px;line-height:1;padding-bottom:12px;min-height:108px}
.choice:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.choice.right{background:#DFF6E6;box-shadow:0 6px 0 var(--good);color:#1E7A41;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.choice.wrong{background:#FFF0F0;opacity:.45;animation:shake .4s;pointer-events:none}
.choice.used{opacity:.25;box-shadow:none;transform:scale(.9);pointer-events:none}
.choice.hint{animation:glow 1s ease-in-out infinite}
.slots{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;min-height:72px;align-items:center}
.slot{width:56px;height:64px;border:3px dashed #C9BBA3;border-radius:8px;background:#F3EAD6;display:grid;place-items:center;font-family:var(--read);font-size:34px;font-weight:700;line-height:1}
.slot.full{border-style:solid;border-color:var(--ink);background:var(--wood);box-shadow:inset 0 -5px 0 var(--wood2);animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.pool{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.pool.c4{grid-template-columns:repeat(4,1fr)}
.pool .choice{min-width:0;font-size:40px;min-height:74px}
.done{font-family:var(--read);font-size:46px;font-weight:700;line-height:1.5;color:#1E7A41;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.btn{min-height:58px;border:3px solid var(--ink);border-radius:12px;box-shadow:0 5px 0 var(--ink);font-size:20px;font-weight:800;display:grid;place-items:center;padding:8px 22px;background:var(--gold)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.btn.wide{width:100%}.btn.soft{background:var(--paper)}.btn:disabled{opacity:.5;cursor:default}
.chars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.ch{border:3px solid var(--ink);border-radius:12px;box-shadow:0 5px 0 var(--ink);background:#EAF6FF;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center}
.ch img{width:74px;height:74px;image-rendering:pixelated}
.ch.sel{background:var(--gold);outline:4px solid var(--ink);outline-offset:2px}
input.nm{width:100%;max-width:300px;font-size:24px;font-weight:700;text-align:center;padding:8px 14px;border:3px solid var(--ink);border-radius:10px;background:#fff;box-shadow:inset 0 4px 0 #EADFC8}
.bar{width:100%;height:20px;border:3px solid var(--ink);border-radius:8px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--mint);transition:width .3s}
.rewards{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.rewards .cube{width:28px;height:28px;border-radius:5px;border:2px solid rgba(0,0,0,.35);box-shadow:inset -5px -5px 0 rgba(0,0,0,.18),inset 4px 4px 0 rgba(255,255,255,.35)}
.lesson-tag{font-size:14px;font-weight:800;color:#fff;background:var(--maroon);border-radius:999px;padding:2px 12px}
.holdbtn{position:relative;overflow:hidden;width:100%;min-height:68px;border:3px solid var(--ink);border-radius:14px;box-shadow:0 6px 0 var(--ink);background:#FFE6F0;font-size:19px;font-weight:800}
.holdbtn i{position:absolute;inset:0;width:0;background:#FF9EC2;z-index:0}
.holdbtn span{position:relative;z-index:1}
.book{max-width:520px;align-items:stretch;text-align:right;gap:12px}
.book h1{text-align:center}
.sec{border:3px solid var(--ink);border-radius:14px;overflow:hidden}
.sec > h3{margin:0;padding:6px 12px;font-size:19px;font-weight:800;color:#fff}
.sec .body{padding:10px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;background:#fff}
.sec.c1 > h3{background:#2EC4B6}.sec.c2 > h3{background:#9B7BFF}.sec.c3 > h3{background:#FF7A59}.sec.c4 > h3{background:#4FA8FF}.sec.c5 > h3{background:#38B86A}.sec.c6 > h3{background:var(--maroon)}.sec.c7 > h3{background:#8C6A3C}
.wcard{border:2px solid var(--ink);border-radius:10px;padding:6px 8px;display:flex;align-items:center;justify-content:space-between;gap:6px;background:#FFFBEF;min-width:0}
.wcard div{font-family:var(--read);font-size:18px;line-height:1.5;min-width:0}
.wcard b{color:#1E6FB8}
.wcard button{flex:none;width:36px;height:36px;border:2px solid var(--ink);border-radius:8px;background:#EAF6FF;font-size:16px}
.tip{grid-column:1/-1;font-size:16px;font-weight:700;line-height:1.6}
.tip .read{font-family:var(--read)}
.prog{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-weight:800;font-size:15px}
.prog .bar{height:16px;border-width:2px}
.linkbtn{font-weight:800;font-size:15px;color:#1E6FB8;text-decoration:underline;padding:4px}
.mstars{font-size:22px;letter-spacing:2px}.mstars .off{filter:grayscale(1);opacity:.35}
.vtiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%}
.vtile{border:3px solid var(--ink);border-radius:14px;box-shadow:0 5px 0 var(--ink);background:#FFF4C2;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:19px}
.vtile:nth-child(2){background:#DFF6E6}.vtile:nth-child(3){background:#EAF6FF}.vtile:nth-child(4){background:#FFE6F0}
.vtile.empty{opacity:.5;box-shadow:none}.vtile small{font-size:13px;color:var(--muted)}
.card.form{align-items:stretch}
.vform{border:3px solid var(--ink);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;background:#FFFBEF;text-align:right}
.vin{width:100%;font-family:var(--read);font-size:20px;padding:6px 10px;border:2px solid var(--ink);border-radius:8px;background:#fff}
.vline{font-family:var(--read);font-size:24px;font-weight:700;line-height:2;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;background:#FFF9E8;border:2px dashed #E3C27A;border-radius:12px;padding:6px 10px;width:100%}
.vgap{color:#C9A26B}
.wblank{display:inline-block;min-width:2.2em;border-bottom:4px dashed var(--coral);color:var(--coral);text-align:center}
.wblank.cur{background:#FFF0EA;border-radius:8px}
.wfill{color:#1E7A41;background:#DFF6E6;border-radius:8px;padding-inline:4px}
.wbox{color:#A86F2E;letter-spacing:2px}
.bridge{position:relative;width:100%;min-height:96px;border:3px solid var(--ink);border-radius:14px;background:repeating-linear-gradient(170deg,#4FA8FF 0 14px,#6CB9FF 14px 26px);overflow:hidden;padding:10px 44px}
.shore{position:absolute;top:0;bottom:0;width:38px;background:#5BC236;border-inline:3px solid var(--ink);display:grid;place-items:center;font-size:22px}
.shore.l{right:0}.shore.r{left:0}
.deck{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-start;align-items:center;min-height:70px}
.plank{font-family:var(--read);font-weight:700;font-size:19px;background:repeating-linear-gradient(180deg,var(--wood) 0 10px,var(--wood2) 10px 12px);border:2px solid var(--ink);border-radius:6px;padding:2px 8px;animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
.plank.stone{background:#C4C4C4}
.wpool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%}
.wblock{font-family:var(--read);font-weight:700;font-size:22px;border:3px solid var(--ink);border-radius:10px;box-shadow:0 5px 0 var(--ink);background:#FFF4C2;padding:6px 12px;min-height:54px}
.wblock:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.wblock.used{opacity:.2;pointer-events:none;box-shadow:none}
.wblock.wrong{animation:shake .4s}.wblock.hint{animation:glow 1s ease-in-out infinite}
.bigv{width:100%;display:flex;flex-direction:column;gap:4px;text-align:right;touch-action:none}
.modebtn{flex:1 1 30%;min-height:46px;border:3px solid var(--ink);border-radius:999px;background:#fff;font-weight:800;font-size:15px;padding:4px 8px}
.modebtn.on{background:#9B7BFF;color:#fff}
.monaStage{display:flex;flex-direction:column;align-items:center;gap:6px}
.monaStage .ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;background:#EDE6FF;border:3px solid var(--ink)}
.monaStage .face{width:118px;height:118px;border-radius:50%;background:#FFFBEF;border:3px solid var(--ink);display:grid;place-items:center;font-size:56px}
.monaStage .lab{font-weight:800;font-size:20px}
.mdots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.mdot{width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);background:#fff;font-weight:800;font-size:14px}
.mdot.done{background:#DFF6E6}.mdot.cur{background:#9B7BFF;color:#fff}
.bag{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;width:100%}
.bagi{border:3px solid var(--ink);border-radius:10px;background:#fff;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:800;line-height:1.2}
.bagi canvas{width:34px;height:34px;image-rendering:pixelated}
.bagi.on{background:var(--gold)}
.swords{display:flex;flex-direction:column;gap:8px;width:100%}
.swd{display:flex;align-items:center;gap:10px;border:3px solid var(--ink);border-radius:12px;padding:6px 10px;background:#fff;text-align:right;font-weight:800}
.swd canvas{width:44px;height:44px;image-rendering:pixelated}
.swd.lock{opacity:.45}.swd.cur{background:#FFF4C2}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:12;width:100%;height:100%}
@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes glow{0%,100%{box-shadow:0 6px 0 var(--ink),0 0 0 0 #FFD93D}50%{box-shadow:0 6px 0 var(--ink),0 0 0 8px #FFD93D}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.qtext{font-size:25px}.choice.word{font-size:20px}.stem{font-size:52px}.pill{font-size:16px;padding:2px 7px}.icon{width:38px;height:38px;font-size:18px}}
</style>
</head>
<body>


<div id="gl"></div>
<div class="cross" id="cross" hidden></div>
<div class="hud" id="hud" hidden>
  <div class="pill star" id="starPill">⭐ <b id="stars">0</b></div>
  <div class="pill" id="swordPill"><canvas id="swordIcon" width="16" height="16"></canvas><b id="swordName"></b></div>
  <div class="pill" id="petPill">🐾 <b id="pets">0</b></div>
  <span class="grow"></span>
  <button class="blockbtn icon" id="btnBook" aria-label="دفتر الدرس">📖</button>
  <button class="blockbtn icon" id="btnBag" aria-label="الحقيبة">🎒</button>
</div>
<div class="side" id="side" hidden>
  <button class="blockbtn icon" id="btnView" aria-label="الكاميرا">👁️</button>
  <button class="blockbtn icon" id="btnMusic" aria-label="الموسيقى">🎵</button>
  <button class="blockbtn icon" id="btnSound" aria-label="الصوت">🔊</button>
</div>
<canvas id="mini" width="128" height="128" hidden></canvas>
<div class="joy" id="joy" hidden><div class="knob" id="knob">🕹️</div></div>
<div class="rbtns" id="rbtns" hidden>
  <button class="act" id="act" hidden></button>
  <button class="round" id="btnJump" aria-label="اقفز">⤴️<small>اقفز</small></button>
</div>

const ray=new THREE.Raycaster();
function onTap(cx,cy){const ndc=new THREE.Vector2((cx/innerWidth)*2-1,-(cy/innerHeight)*2+1);ray.setFromCamera(ndc,camera);const o=ray.ray.origin,d=ray.ray.direction;
  let best=null,bd=Infinity;const test=(ent,type,px,py,pz,r)=>{const v=new THREE.Vector3(px,py,pz).sub(o);const tt=v.dot(d);if(tt<0)return;const dist2=v.lengthSq()-tt*tt;if(dist2<r*r&&tt<bd&&Math.hypot(px-P.x,pz-P.z)<7){bd=tt;best={ent,type};}};
  mobs.forEach(m=>{if(m.state!=='dying')test(m,'mob',m.g.position.x,m.g.position.y+(m.kind==='skel'?1:0.5),m.g.position.z,m.kind==='skel'?0.9:0.75);});
  animals.forEach(a=>test(a,'animal',a.g.position.x,a.g.position.y+a.h/2,a.g.position.z,0.9));
  villagers.forEach(v=>test(v,'vill',v.g.position.x,v.g.position.y+0.9,v.g.position.z,0.8));
  chests.forEach(ch=>{if(!ch.open)test(ch,'chest',ch.g.position.x,ch.g.position.y+0.4,ch.g.position.z,0.7);});
  const hit=voxRay(o.x,o.y,o.z,d.x,d.y,d.z,40,false);
  if(best&&(!hit||bd<hit.t+0.3)){interactEntity(best.ent,best.type);return;}
  if(!hit)return;const dist=Math.hypot(hit.x+0.5-P.x,hit.y+0.5-(P.y+1),hit.z+0.5-P.z);
  if(dist>7){hint('بعيد! قرّب أكثر 👣',1400);return;}
  const bd2=BD[hit.b];
  if(bd2.lucky){openLucky(hit);return;}
  if(bd2.memo){openMemo();return;}
  if(bd2.ore){openOre(hit);return;}
  const it=save.hot[save.sel];
  if(typeof it==='number'){placeBlock(hit,it);return;}
  breakBlock(hit);
}

      (async()=>{try{await spawnVillagers();await loadOwnedPets();await spawnAnimals();await keepMobs();}catch(e){console.warn(e);}})();}
    else{const cg=await loadGLB('character-'+sel+'.txt');scene.remove(player);player=instance(cg,1.8);scene.add(player);placeHeldItems();}
    setCrown(!!save.crown);
  }catch(e){console.error(e);$('#loadMsg').textContent='ما قدرت أبني العالم… حدّث الصفحة 🙏';btn.disabled=false;return;}
  if(!Object.keys(save.inv).length)save.inv={[B.GRASS]:16,[B.PLANKS]:24,[B.COBBLE]:16,[B.GLASS]:8,[B.BRICK]:8,[B.MAROON]:8,[B.WHITE]:8,[B.LAMP]:4};
  checkTier();refreshSword();updateHeld();renderHotbar();
  $('#start').hidden=true;$('#hud').hidden=false;$('#side').hidden=false;$('#joy').hidden=false;$('#rbtns').hidden=false;$('#mini').hidden=false;$('#hotbar').hidden=false;updHud();updateSoundBtns();paused=false;
  prefetch(['fb_ok1','fb_ok2','fb_ok3','fb_ok4','fb_no1','fb_no2','m_hi1','m_hi2','m_wrong1','m_wrong2','m_caught','m_right1','m_right2']);
  if(save.music)playMusic('bg',true,0.1);say('ev_welcome');
  hint('🕹️ امشِ بالعصا، واسحب الشاشة عشان تلف الكاميرا. اضغط على المكعبات عشان تكسر أو تبني!',6000);
  btn.disabled=false;$('#bar').hidden=true;$('#loadMsg').hidden=true;};
updateSoundBtns();
